name: Build DRMD 6DOF
run-name: Checkpoint · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [ '**' ]
    paths-ignore: ['.github/workflows/recovery-inspect.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Preserve every milestone even if a later push arrives or the game build fails.
jobs:
  source-checkpoint:
    name: Preserve source checkpoint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact source revision
        run: |
          mkdir -p checkpoint
          git archive --format=tar.gz --output=checkpoint/source.tar.gz HEAD
          git rev-parse HEAD > checkpoint/SOURCE_SHA.txt
          printf '%s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > checkpoint/RUN_URL.txt
          cp docs/recovery/RECOVERY.md checkpoint/
          sha256sum checkpoint/source.tar.gz > checkpoint/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkpoint/
          if-no-files-found: error
          retention-days: 90

  fabric-pc:
    name: Unit, world, real client and JAR
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start evidence record
        run: |
          mkdir -p build/checkpoint/logs
          date +%s > build/checkpoint/started-at.txt
          git rev-parse HEAD > build/checkpoint/SOURCE_SHA.txt
      - name: Test evidence gate
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Audit model and texture resource graph
        run: python3 scripts/audit_resources.py --out build/checkpoint/resources
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Restore Minecraft setup cache
        id: loom-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
          key: ${{ runner.os }}-minecraft-setup-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Install real-client graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0
          chmod +x gradlew
      - name: Unit tests
        id: unit
        run: ./gradlew test compileShootcheckJava --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/unit.log
      - name: Server GameTests
        id: gametest
        run: ./gradlew runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/gametest.log
      - name: Build remapped Fabric JAR
        id: build
        run: ./gradlew build --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/build.log
      - name: Verify weapon images and client motion
        id: shootcheck
        run: |
          rm -f build/shootcheck/shootcheck-ok.json build/shootcheck/hybrid-weapons-ok.json \
            build/shootcheck/audit-ok.json \
            build/shootcheck/swarm-profile.csv \
            build/shootcheck/inventory-models.tsv
          LIBGL_ALWAYS_SOFTWARE=1 timeout 900s xvfb-run -a ./gradlew runShootcheck --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/shootcheck.log
      - name: Verify real client
        id: rendercheck
        run: |
          # Only disposable generated markers are cleared, never user worlds or tracked dist.
          for marker in rendercheck-ok collapse-ok ragdoll-ok gravity-weapons-ok swarm-ai-ok; do
            rm -f "build/rendercheck/${marker}.txt"
          done
          LIBGL_ALWAYS_SOFTWARE=1 timeout 360s xvfb-run -a ./gradlew runRendercheck --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/rendercheck.log
      - name: Verify snapshot weapon input, fixed tools and drone inventory
        if: contains(github.ref_name, 'ungravity-cloud-recovery') && (startsWith(github.event.head_commit.message, '[snapshot source]') || startsWith(github.event.head_commit.message, '[boarding source]'))
        env:
          DRMD_SNAPSHOT_CHECK: '1'
        run: |
          rm -f build/shootcheck/snapshot-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 360s xvfb-run -a ./gradlew runShootcheck -x runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/snapshot.log
      - name: Verify joined mirrors and portals with Fabulous transparency
        if: contains(github.ref_name, 'ungravity-cloud-recovery') && (startsWith(github.event.head_commit.message, '[snapshot source]') || startsWith(github.event.head_commit.message, '[boarding source]'))
        env:
          DRMD_MIRROR_JOIN_CHECK: '1'
          DRMD_TEST_FABULOUS: '1'
        run: |
          rm -f build/shootcheck/mirror-join-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 360s xvfb-run -a ./gradlew runShootcheck -x runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/mirror-fabulous.log
      - name: Verify horizon anchoring and repaired visuals
        if: contains(github.ref_name, 'ungravity-cloud-recovery') && (startsWith(github.event.head_commit.message, '[snapshot source]') || startsWith(github.event.head_commit.message, '[boarding source]'))
        env:
          DRMD_HORIZON_CHECK: '1'
        run: |
          rm -f build/shootcheck/horizon-anchor-ok.json build/shootcheck/repair-visual-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 360s xvfb-run -a ./gradlew runShootcheck -x runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/horizon-anchor.log
      - name: Verify actual boarding controls and authoritative movement
        id: boardingcheck
        run: |
          rm -f build/boardingcheck/boarding-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 360s xvfb-run -a ./gradlew runBoardingcheck -x runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/boardingcheck.log
      - name: Verify ship gravity, oriented interior and full physical rotations
        id: shipboardingcheck
        run: |
          rm -f build/shipboardingcheck/ship-boarding-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a ./gradlew runShipboardingcheck -x runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/shipboardingcheck.log
      - name: Verify local hull edits, Survival mining and geometry synchronization
        id: bodyeditcheck
        run: |
          rm -f build/bodyeditcheck/body-edit-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a ./gradlew runBodyeditcheck -x runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/bodyeditcheck.log
      - name: Verify real input on the distant hull edge beyond its pivot section
        id: bodyindexcheck
        run: |
          rm -f build/bodyindexcheck/body-index-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a ./gradlew runBodyindexcheck -x runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/bodyindexcheck.log
      - name: Verify full 32768-block hull input and snapshot rebase
        id: bodyscalecheck
        run: |
          rm -f build/bodyscalecheck/body-scale-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a ./gradlew runBodyscalecheck -x runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/bodyscalecheck.log
      - name: Verify actual oriented hull contacts and synchronized client poses
        id: hullcontactcheck
        run: |
          rm -f build/hullcontactcheck/body-contacts-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a ./gradlew runHullcontactcheck -x runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/hullcontactcheck.log
      - name: Verify real hull fragments, high inherited velocity and saved local state
        id: fracturecheck
        run: |
          rm -f build/fracturecheck/body-contacts-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 600s xvfb-run -a ./gradlew runFracturecheck -x runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/fracturecheck.log
      - name: Validate fresh evidence and stage only the current JAR
        id: verify
        run: python3 scripts/checkpoint_report.py --verify 2>&1 | tee build/checkpoint/logs/verify.log
      - name: Write checkpoint report even on failure
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          GAMETEST_OUTCOME: ${{ steps.gametest.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RENDERCHECK_OUTCOME: ${{ steps.rendercheck.outcome }}
          SHOOTCHECK_OUTCOME: ${{ steps.shootcheck.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python3 scripts/checkpoint_report.py --report
          cat build/checkpoint/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save report, logs and frames even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/checkpoint/
            build/fracturecheck/body-contacts-ok.json
            build/fracturecheck/body-contact-frames/
            build/fracturecheck/logs/
            build/fracturecheck/crash-reports/
            build/hullcontactcheck/body-contacts-ok.json
            build/hullcontactcheck/body-contact-frames/
            build/hullcontactcheck/logs/
            build/hullcontactcheck/crash-reports/
            build/bodyscalecheck/body-scale-ok.json
            build/bodyscalecheck/body-scale-frames/
            build/bodyscalecheck/logs/
            build/bodyscalecheck/crash-reports/
            build/bodyindexcheck/body-index-ok.json
            build/bodyindexcheck/body-index-frames/
            build/bodyindexcheck/logs/
            build/bodyindexcheck/crash-reports/
            build/bodyeditcheck/body-edit-ok.json
            build/bodyeditcheck/body-edit-frames/
            build/bodyeditcheck/logs/
            build/bodyeditcheck/crash-reports/
            build/shipboardingcheck/ship-boarding-ok.json
            build/shipboardingcheck/ship-boarding-frames/
            build/shipboardingcheck/logs/
            build/shipboardingcheck/crash-reports/
            build/boardingcheck/boarding-ok.json
            build/boardingcheck/boarding-frames/
            build/boardingcheck/logs/
            build/boardingcheck/crash-reports/
            build/test-results/test/
            build/gametest/item-resource-inventory.tsv
            build/gametest/reports/
            build/gametest/logs/
            build/gametest/crash-reports/
            build/rendercheck/screenshots/
            build/rendercheck/logs/
            build/rendercheck/crash-reports/
            build/rendercheck/*-ok.txt
            build/shootcheck/snapshot-frames/
            build/shootcheck/snapshot-ok.json
            build/shootcheck/mirror-join-frames/
            build/shootcheck/mirror-join-ok.json
            build/shootcheck/horizon-anchor-frames/
            build/shootcheck/horizon-anchor-ok.json
            build/shootcheck/repair-visual-frames/
            build/shootcheck/repair-visual-ok.json
            build/shootcheck/screenshots/
            build/shootcheck/logs/
            build/shootcheck/crash-reports/
            build/shootcheck/shootcheck-ok.json
            build/shootcheck/hybrid-weapons-ok.json
            build/shootcheck/audit-ok.json
            build/shootcheck/swarm-profile.csv
            build/shootcheck/inventory-models.tsv
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified installable mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drmd-pc-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/checkpoint/distribution/
            build/checkpoint/REPORT.md
            build/checkpoint/SOURCE_SHA.txt
          if-no-files-found: error
          retention-days: 90
      - name: Preserve resolved Minecraft setup after a client assertion
        if: always() && steps.unit.outcome == 'success' && steps.loom-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/fabric-loom
            .gradle/loom-cache
          key: ${{ steps.loom-cache.outputs.cache-primary-key }}
      - name: Preserve failed-client diagnostics for recovery inspection
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/codex/ungravity-cloud-recovery-20261024'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="recovery-diagnostics-${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            build/checkpoint/REPORT.md \
            build/checkpoint/diagnostics.txt \
            build/checkpoint/screenshots.zip \
            --target "$GITHUB_SHA" \
            --title "Recovery diagnostics: failed verification (${GITHUB_SHA:0:7})" \
            --notes "Failed experimental verification. Frames and diagnostics only; no certified mod binary." \
            --prerelease --latest=false
      - name: Publish verified audit checkpoint
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/ungravity-cloud-recovery-20261024' && startsWith(steps.verify.outputs.version, '1.1.14')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          tag="audit-${VERSION}-${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            build/checkpoint/distribution/*.jar \
            build/checkpoint/distribution/SHA256SUMS \
            build/checkpoint/distribution/swarm-profile.csv \
            build/checkpoint/distribution/inventory-models.tsv \
            build/checkpoint/REPORT.md \
            build/checkpoint/screenshots.zip \
            --target "$GITHUB_SHA" \
            --title "UNGRAVITY ${VERSION} video audit (${GITHUB_SHA:0:7})" \
            --notes-file build/checkpoint/REPORT.md \
            --prerelease --latest=false

      - name: Commit the verified snapshot JAR and evidence directly to the repository
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/ungravity-cloud-recovery-20261024' && startsWith(github.event.head_commit.message, '[snapshot source]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_snapshot_ci.py
          git config user.name 'Ungravity checkpoint bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/README.md dist/releases/1.1.23-snapshot.1/*.jar dist/releases/1.1.23-snapshot.1/README.md dist/releases/1.1.23-snapshot.1/INSTALL_TLAUNCHER.txt dist/releases/1.1.23-snapshot.1/SOURCE_SHA.txt
          git commit -m '[snapshot package] Publish verified 1.1.23-snapshot.1 JAR'
          git add dist/releases/1.1.23-snapshot.1
          git commit -m '[snapshot evidence] Preserve exact-source CI logs, frames and checksums'
          git -c 'credential.helper=!gh auth git-credential' push origin "HEAD:${GITHUB_REF#refs/heads/}"

      - name: Commit the verified physical hull JAR and evidence directly to the repository
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/codex/ungravity-cloud-recovery-20261024' && startsWith(github.event.head_commit.message, '[boarding source]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_boarding_ci.py
          git config user.name 'Ungravity checkpoint bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/README.md dist/releases/1.1.33-combat.1/*.jar dist/releases/1.1.33-combat.1/README.md dist/releases/1.1.33-combat.1/INSTALL_TLAUNCHER.txt dist/releases/1.1.33-combat.1/SOURCE_SHA.txt
          git commit -m '[boarding package] Publish verified 1.1.33-combat.1 JAR'
          git add dist/releases/1.1.33-combat.1
          git commit -m '[boarding evidence] Preserve exact-source local hull combat and fracture proof'
          git -c 'credential.helper=!gh auth git-credential' push origin "HEAD:${GITHUB_REF#refs/heads/}"
