name: Build DRMD 6DOF
run-name: Checkpoint · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [ '**' ]
    paths-ignore: ['.github/workflows/recovery-inspect.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Preserve every milestone even if a later push arrives or the game build fails.
jobs:
  source-checkpoint:
    name: Preserve source checkpoint
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive the exact source revision
        run: |
          mkdir -p checkpoint
          git archive --format=tar.gz --output=checkpoint/source.tar.gz HEAD
          git rev-parse HEAD > checkpoint/SOURCE_SHA.txt
          printf '%s\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > checkpoint/RUN_URL.txt
          cp docs/recovery/RECOVERY.md checkpoint/
          sha256sum checkpoint/source.tar.gz > checkpoint/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkpoint/
          if-no-files-found: error
          retention-days: 90

  fabric-pc:
    name: Unit, world, real client and JAR
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start evidence record
        run: |
          mkdir -p build/checkpoint/logs
          date +%s > build/checkpoint/started-at.txt
          git rev-parse HEAD > build/checkpoint/SOURCE_SHA.txt
      - name: Test evidence gate
        run: python3 -m unittest discover -s scripts -p 'test_checkpoint_report.py' -v
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Install real-client graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0
          chmod +x gradlew
      - name: Unit tests
        id: unit
        run: ./gradlew test compileShootcheckJava --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/unit.log
      - name: Server GameTests
        id: gametest
        run: ./gradlew runGametest --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/gametest.log
      - name: Build remapped Fabric JAR
        id: build
        run: ./gradlew build --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/build.log
      - name: Verify weapon images and client motion
        id: shootcheck
        run: |
          rm -f build/shootcheck/shootcheck-ok.json
          LIBGL_ALWAYS_SOFTWARE=1 timeout 360s xvfb-run -a ./gradlew runShootcheck --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/shootcheck.log
      - name: Verify real client
        id: rendercheck
        run: |
          # Only disposable generated markers are cleared, never user worlds or tracked dist.
          for marker in rendercheck-ok collapse-ok ragdoll-ok gravity-weapons-ok swarm-ai-ok; do
            rm -f "build/rendercheck/${marker}.txt"
          done
          LIBGL_ALWAYS_SOFTWARE=1 timeout 360s xvfb-run -a ./gradlew runRendercheck --no-daemon --console=plain --stacktrace 2>&1 | tee build/checkpoint/logs/rendercheck.log
      - name: Validate fresh evidence and stage only the current JAR
        id: verify
        run: python3 scripts/checkpoint_report.py --verify 2>&1 | tee build/checkpoint/logs/verify.log
      - name: Write checkpoint report even on failure
        if: always()
        env:
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          GAMETEST_OUTCOME: ${{ steps.gametest.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RENDERCHECK_OUTCOME: ${{ steps.rendercheck.outcome }}
          SHOOTCHECK_OUTCOME: ${{ steps.shootcheck.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          python3 scripts/checkpoint_report.py --report
          cat build/checkpoint/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save report, logs and frames even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/checkpoint/
            build/test-results/test/
            build/gametest/reports/
            build/gametest/logs/
            build/gametest/crash-reports/
            build/rendercheck/screenshots/
            build/rendercheck/logs/
            build/rendercheck/crash-reports/
            build/rendercheck/*-ok.txt
            build/shootcheck/screenshots/
            build/shootcheck/logs/
            build/shootcheck/crash-reports/
            build/shootcheck/shootcheck-ok.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified installable mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drmd-pc-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/checkpoint/distribution/
            build/checkpoint/REPORT.md
            build/checkpoint/SOURCE_SHA.txt
          if-no-files-found: error
          retention-days: 90
      - name: Preserve failed-client diagnostics for recovery inspection
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/codex/ungravity-cloud-recovery-20261024'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="recovery-diagnostics-${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            build/checkpoint/REPORT.md \
            build/checkpoint/diagnostics.txt \
            build/checkpoint/screenshots.zip \
            --target "$GITHUB_SHA" \
            --title "Recovery diagnostics: failed verification (${GITHUB_SHA:0:7})" \
            --notes "Failed experimental verification. Frames and diagnostics only; no certified mod binary." \
            --prerelease --latest=false
      - name: Publish recovered 1.1.12 and evidence as a downloadable prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/ungravity-cloud-recovery-20261024' && steps.verify.outputs.version == '1.1.12'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="recovered-1.1.12-${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            build/checkpoint/distribution/*.jar \
            build/checkpoint/distribution/SHA256SUMS \
            build/checkpoint/REPORT.md \
            build/checkpoint/screenshots.zip \
            --target "$GITHUB_SHA" \
            --title "UNGRAVITY 1.1.12 recovered (${GITHUB_SHA:0:7})" \
            --notes-file build/checkpoint/REPORT.md \
            --prerelease --latest=false
