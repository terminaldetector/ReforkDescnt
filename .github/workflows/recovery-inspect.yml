name: Inspect preserved recovery evidence

on:
  push:
    paths: ['.github/workflows/recovery-inspect.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the already preserved failed-client evidence
        run: |
          gh run download 40106885198 \
            --name evidence-7ac100505ddb721d381b769682135cf7ff034040-40106885198-1 \
            --dir evidence
          gh run view 40106885198 --log-failed > failed-job.log
          gh run view 40106885198 --job 120910313402 --log > full-job.log
      - name: Prepare diagnostic excerpts and original frames
        shell: python
        run: |
          from pathlib import Path
          import zipfile
          base = Path('evidence')
          selected = []
          words = ('DRMD shootcheck:', 'IllegalStateException', 'Caused by:', 'Exception',
                   'ERROR', 'at com.terminaldetector.', 'Failed to', 'FAILURE:', 'timed out')
          for path in sorted(base.rglob('*')):
              if path.is_file() and ('shootcheck' in str(path) or path.name == 'REPORT.md') and path.suffix in ('.log', '.txt', '.md'):
                  lines = path.read_text(errors='replace').splitlines()
                  selected += [str(path)] + ([line for line in lines if len(line) < 2000 and any(word in line for word in words)] if path.name != 'REPORT.md' else lines)
          for line in Path('failed-job.log').read_text(errors='replace').splitlines():
              if any(word in line.lower() for word in ('error', '403', '422', 'forbidden', 'accessible', 'validation failed', 'release already')):
                  safe=line.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
                  print('::notice title=Preserved publication failure::'+safe[:1800])
          Path('diagnostics.txt').write_text('\n'.join(selected) + '\n')
          lines = Path('full-job.log').read_text(errors='replace').splitlines()
          with Path('diagnostics.txt').open('a') as out:
              for index, line in enumerate(lines):
                  if 'GITHUB_TOKEN Permissions' in line:
                      out.write('\n' + '\n'.join(lines[index:index+12]) + '\n')
          with zipfile.ZipFile('screenshots.zip', 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for frame in base.rglob('*.png'):
                  archive.write(frame, str(frame.relative_to(base)))
      - name: Publish inspection package without a mod binary
        run: |
          gh release create "recovery-inspection-40106885198-${GITHUB_RUN_ID}" \
            diagnostics.txt screenshots.zip failed-job.log \
            --target "$GITHUB_SHA" \
            --title "Preserved failed-client diagnostics (run 40106885198)" \
            --notes "Inspection of an existing failed checkpoint; no rebuilt or certified mod binary." \
            --prerelease --latest=false
